<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>BoSo</title>
    <meta name="description" content="교통 정책과 해야 할 일을 한곳에서 살펴보는 BoSo" />
    <link rel="stylesheet" href="./src/styles.css" />
  </head>
  <body>
    <div class="app-shell">
      <a class="skip-link" href="#main-content">본문으로 바로가기</a>
      <header class="site-header">
        <div class="header-inner container">
          <a class="brand" href="#/home" aria-label="BoSo 홈">
            <img src="./src/assets/boso-logo.png" alt="" width="48" height="48" />
            <span>BoSo</span>
          </a>
          <nav class="primary-nav" aria-label="주요 메뉴">
            <a class="nav-link" href="#/home" data-route="home">홈</a>
            <a class="nav-link" href="#/todos" data-route="todos">To-Do</a>
            <a class="nav-link" href="#/policies" data-route="policies">정책 변화</a>
            <a class="nav-link" href="#/chat" data-route="chat">AI 챗봇</a>
          </nav>
          <div class="header-actions">
            <a class="icon-link" href="#/notifications" data-route="notifications" aria-label="알림">
              <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M18 8a6 6 0 0 0-12 0c0 7-3 7-3 9h18c0-2-3-2-3-9M10 21h4" /></svg>
            </a>
            <a class="member-link" href="#/profile" data-route="profile">
              <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="7" r="4" /><path d="M4 21v-2a8 8 0 0 1 16 0v2" /></svg>
              <span data-member-label>로그인</span>
            </a>
            <button class="member-link" id="logout-button" type="button" hidden>로그아웃</button>
          </div>
        </div>
      </header>
      <div class="container"><p id="session-notice" class="session-notice" role="status" hidden></p></div>
      <main id="main-content" class="main-content container" tabindex="-1"></main>
      <footer class="site-footer">
        <div class="footer-inner container">
          <div><a href="#/home" class="footer-brand">BoSo</a><p>교통카드 혜택을 놓치지 않도록.</p></div>
          <span id="mode-label" class="badge badge--neutral" role="status"></span>
          <small>© <span id="current-year">2026</span> BoSo</small>
        </div>
      </footer>
    </div>

    <template id="home-view">
      <div class="intro-grid">
        <section class="welcome" aria-labelledby="welcome-title">
          <div class="welcome-copy">
            <p class="eyebrow">YOUR TRANSIT POLICY ASSISTANT</p>
            <h1 id="welcome-title">교통카드 혜택을 놓치지 않도록,<br />BoSo가 함께 살펴볼게요.</h1>
            <p class="welcome-description">흩어진 교통 정책은 한곳에서 확인하고,<br />내 상황에 맞는 확인 목록을 관리해 보세요.</p>
          </div>
          <img class="welcome-character" src="./src/assets/boso-guide.png" alt="" width="155" height="155" />
        </section>
        <section class="card intro-aside" aria-labelledby="intro-title">
          <span class="badge badge--blue">교통카드 관리 서비스</span>
          <h2 id="intro-title">복잡한 정책도, <br />나에게 필요한 정보부터.</h2>
          <p>정책 확인부터 해야 할 일까지 <br />BoSo와 차근차근 살펴보세요.</p>
          <a class="button button--subtle" href="#/policies">정책 메뉴 둘러보기</a>
        </section>
      </div>
      <section class="service-section" aria-labelledby="service-title">
        <div class="section-heading">
          <div><h2 id="service-title">BoSo와 함께할 교통 생활</h2><p>필요한 정보를 더 쉽게 확인할 수 있도록 준비하고 있어요.</p></div>
          <span class="badge badge--neutral">준비 중</span>
        </div>
        <div class="service-grid">
          <section class="card" aria-labelledby="policy-title">
            <span class="service-icon" aria-hidden="true"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"><path d="M6 3h12v18H6zM9 7h6M9 11h6M9 15h4" /></svg></span>
            <h3 id="policy-title">교통 정책 간편 요약</h3>
            <p>여러 곳에 흩어진 교통 정책과 <br />변경사항을 한곳에서 살펴보세요.</p>
            <a class="button button--subtle" href="#/policies">정책 변화</a>
          </section>
          <section class="card" aria-labelledby="todo-title">
            <span class="service-icon" aria-hidden="true"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M9 5h12M9 12h12M9 19h12M2 5l2 2 3-4M2 12l2 2 3-4M2 19l2 2 3-4" /></svg></span>
            <h3 id="todo-title">나에게 필요한 To-Do</h3>
            <p>내 상황에 맞는 확인 목록으로 <br />해야 할 일을 놓치지 마세요.</p>
            <a class="button button--subtle" href="#/todos">To-Do</a>
          </section>
          <section class="card" aria-labelledby="chat-title">
            <span class="service-icon" aria-hidden="true"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M21 11a8 8 0 0 1-8 8H8l-5 3V11a8 8 0 0 1 8-8h2a8 8 0 0 1 8 8ZM8 10h8M8 14h5" /></svg></span>
            <h3 id="chat-title">궁금할 땐 AI 챗봇</h3>
            <p>어려운 교통 정책과 카드 정보, <br />궁금한 내용을 물어보세요.</p>
            <a class="button button--subtle" href="#/chat">AI 챗봇</a>
          </section>
        </div>
      </section>
    </template>
    <template id="auth-view">
      <section class="auth-card card" aria-labelledby="auth-title">
        <p class="auth-brand">BoSo</p>
        <h1 id="auth-title" data-auth-title>로그인</h1>
        <p class="auth-description" data-auth-description>나에게 필요한 교통 혜택을 함께 살펴봐요.</p>
        <p class="auth-demo-note" data-demo-note hidden>시연 모드입니다. 실제 개인정보 대신 예시 이메일과 비밀번호를 사용해 주세요. 만든 계정은 이 화면을 새로고침하면 초기화됩니다.</p>
        <p class="form-message" data-auth-message role="alert" hidden></p>
        <form data-auth-form method="post">
          <fieldset class="auth-fields">
            <legend class="visually-hidden">계정 정보 입력</legend>
            <div class="form-field">
              <label for="auth-email">이메일</label>
              <input id="auth-email" name="email" type="email" maxlength="320" autocomplete="username" placeholder="you@example.com" required />
            </div>
            <div class="form-field">
              <label for="auth-password">비밀번호</label>
              <input id="auth-password" name="password" type="password" autocomplete="current-password" aria-describedby="password-help" required />
              <p class="field-help" id="password-help">15~128자로 입력해 주세요. 공백도 비밀번호에 포함됩니다.</p>
            </div>
            <div class="form-field" data-confirm-field hidden>
              <label for="auth-confirmation">비밀번호 확인</label>
              <input id="auth-confirmation" name="confirmation" type="password" autocomplete="new-password" />
            </div>
            <button class="button button--primary auth-submit" type="submit" data-auth-submit>로그인</button>
            <button class="button button--secondary" type="button" data-demo-login hidden>시연 계정으로 둘러보기</button>
          </fieldset>
        </form>
        <p class="auth-switch"><span data-switch-description>아직 계정이 없으신가요?</span> <a href="#/signup" data-switch-link>회원가입</a></p>
      </section>
    </template>
    <template id="session-view">
      <section class="auth-card card" aria-labelledby="session-title">
        <span class="badge badge--blue">BoSo 계정</span>
        <h1 id="session-title" data-session-title>로그인 정보를 확인하고 있어요</h1>
        <p class="auth-description" data-session-description>잠시만 기다려 주세요.</p>
        <div class="session-actions" data-session-actions hidden>
          <button class="button button--primary" type="button" data-retry-session>다시 연결</button>
          <a class="button button--secondary" href="#/login">로그인 화면</a>
        </div>
      </section>
    </template>
    <template id="placeholder-view">
      <div class="page-heading"><h1 data-heading></h1><p data-description></p></div>
      <section class="card">
        <span class="badge badge--neutral">준비 중</span>
        <div class="empty-state">
          <span class="empty-state__icon" aria-hidden="true"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"><circle cx="12" cy="12" r="10" /><path d="M12 11v6M12 7v.01" /></svg></span>
          <h2 data-empty-title>조금만 기다려 주세요</h2>
          <p data-empty-description>더 편리하게 이용하실 수 있도록 준비하고 있어요.</p>
          <div class="empty-state__action"><a class="button button--secondary" href="#/home">홈으로 이동</a></div>
        </div>
      </section>
    </template>
    <noscript><p class="container">BoSo를 이용하려면 브라우저에서 JavaScript를 허용해 주세요.</p></noscript>
    <script id="boso-config" type="application/json">{"mode":"auto","apiBaseUrl":"http://localhost:8000"}</script>
    <script defer src="./src/services.js"></script>
    <script defer src="./src/auth.js"></script>
    <script defer src="./src/app.js"></script>
  </body>
</html>
