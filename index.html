<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>BoSo</title>
    <meta name="description" content="교통 정책과 해야 할 일을 한곳에서 살펴보는 BoSo" />
    <link rel="stylesheet" href="./src/styles.css" />
  </head>
  <body>
    <div class="app-shell">
      <a class="skip-link" href="#main-content">본문으로 바로가기</a>
      <header class="site-header">
        <div class="header-inner container">
          <a class="brand" href="#/home" aria-label="BoSo 홈">
            <img src="./src/assets/boso-logo.png" alt="" width="48" height="48" />
            <span>BoSo</span>
          </a>
          <nav class="primary-nav" aria-label="주요 메뉴">
            <a class="nav-link" href="#/home" data-route="home">홈</a>
            <a class="nav-link" href="#/todos" data-route="todos">To-Do</a>
            <a class="nav-link" href="#/policies" data-route="policies">정책 변화</a>
            <a class="nav-link" href="#/chat" data-route="chat">AI 챗봇</a>
          </nav>
          <div class="header-actions">
            <a class="icon-link" href="#/notifications" data-route="notifications" aria-label="알림">
              <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M18 8a6 6 0 0 0-12 0c0 7-3 7-3 9h18c0-2-3-2-3-9M10 21h4" /></svg>
            </a>
            <a class="member-link" href="#/profile" data-route="profile">
              <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="7" r="4" /><path d="M4 21v-2a8 8 0 0 1 16 0v2" /></svg>
              <span data-member-label>로그인</span>
            </a>
            <button class="member-link" id="logout-button" type="button" hidden>로그아웃</button>
          </div>
        </div>
      </header>
      <div class="container"><p id="session-notice" class="session-notice" role="status" hidden></p></div>
      <main id="main-content" class="main-content container" tabindex="-1"></main>
      <footer class="site-footer">
        <div class="footer-inner container">
          <div><a href="#/home" class="footer-brand">BoSo</a><p>교통카드 혜택을 놓치지 않도록.</p></div>
          <span id="mode-label" class="badge badge--neutral" role="status"></span>
          <small>© <span id="current-year">2026</span> BoSo</small>
        </div>
      </footer>
    </div>

    <template id="home-view">
      <div class="wireframe-page home-page">
        <section class="policy-hero" aria-labelledby="welcome-title">
          <div><p class="eyebrow">내 교통카드 혜택을 챙기는 똑똑한 친구</p><h1 id="welcome-title">교통 정책, 무엇이 달라졌을까요?</h1><p>흩어진 공식 안내를 모아 달라진 내용과 내게 미치는 영향을 쉽게 정리해드려요.</p></div>
          <img src="./src/assets/boso-guide.png" alt="" width="140" height="140" />
        </section>
        <div class="home-shortcuts">
          <section class="home-shortcut home-shortcut--pink"><p class="eyebrow">확인할 일을 살펴보세요</p><h2>교통 정책 변경, 내가 할 일<br />확인하기</h2><p>내 조건에 영향을 주는 변화와 필요한 절차를 확인해보세요.</p><a class="button button--rose" href="#/todos">내가 해야 할 일 보기</a></section>
          <section class="home-shortcut home-shortcut--blue"><h2>교통 정책, 무엇이 달라졌을까요?</h2><p>여러 기관에 흩어진 교통카드 정책과 변경 공지를<br />핵심만 모아 쉽게 알려드려요.</p><a class="button button--primary" href="#/policies">바뀐 정책 확인하기</a></section>
        </div>
        <section class="home-ai-strip" aria-label="BoSo AI 정책 안내">
          <img src="./src/assets/boso-logo.png" alt="" width="80" height="80" />
          <div><p class="eyebrow">BoSo AI 추천</p><h2>나에게 맞는 교통카드가 궁금한가요?</h2><p data-policy-home-status role="status">등록한 교통 정보를 바탕으로 살펴보세요. 개인별 추천은 준비 중입니다.</p></div>
          <a class="button button--primary" data-policy-home-link href="#/policies">정책 요약 보기</a>
        </section>
      </div>
    </template>
    <template id="policies-view">
      <section class="wireframe-page" aria-labelledby="policies-title">
        <section class="policy-hero"><div><p class="eyebrow">내 교통카드 혜택을 챙기는 똑똑한 친구</p><h1 id="policies-title">교통 정책, 무엇이 달라졌을까요?</h1><p>흩어진 공식 안내를 모아 달라진 내용과 내게 미치는 영향을 쉽게 정리해드려요.</p></div><img src="./src/assets/boso-guide.png" alt="" width="140" height="140" /></section>
        <nav class="policy-tabs" aria-label="정책 소식 구분"><a href="#/policies?tab=related" data-policy-tab="related">내 관련 소식</a><a href="#/policies?tab=all" data-policy-tab="all">전체 정책</a></nav>
        <p class="policy-demo-note" data-policy-demo hidden>시연 데이터 · 실제 정책 및 AI 결과가 아닙니다.</p>
        <details class="policy-search-disclosure"><summary>정책 검색·필터</summary>
        <form class="policy-search" data-policy-search method="get" role="search" aria-label="정책 검색">
          <div class="form-field"><label for="policy-query">정책 검색</label><input id="policy-query" name="q" type="search" maxlength="100" placeholder="정책명이나 변경 내용 검색" /></div>
          <div class="form-field"><label for="policy-category">카테고리</label><select id="policy-category" name="category"><option value="">전체 카테고리</option></select></div>
          <div class="form-field"><label for="policy-state">적용 상태</label><select id="policy-state" name="state"><option value="">전체 상태</option></select></div>
          <button class="button button--primary" type="submit">검색</button><a class="button button--secondary" href="#/policies">초기화</a>
        </form></details>
        <p class="policy-status" data-policy-status role="status">정책 정보를 확인하고 있어요.</p>
        <button class="button button--secondary" type="button" data-policy-retry hidden>다시 확인</button>
        <div class="policy-columns"><div class="policy-list" data-policy-list></div><aside class="policy-impact" aria-labelledby="impact-title"><p class="eyebrow">내 영향 확인</p><h2 id="impact-title">이 변화, 나와 관련 있나요?</h2><p class="impact-label">현재 이용 카드</p><p class="impact-value" data-policy-my-cards>교통 정보를 확인해 주세요.</p><p>다른 교통카드를 비교 중이라면,<br />이용 가능한 노선을 먼저 확인해보세요.</p><h3>지금 확인할 일</h3><p>내 이동 경로와 카드 이용 범위를 비교해요.</p><p class="field-help" data-policy-related-note>적용 대상 여부는 공식 조건을 확인해야 합니다.</p><a class="button button--rose" href="#/chat">BoSo에게 물어보기</a></aside></div>
        <nav class="policy-pagination" data-policy-pagination aria-label="정책 목록 페이지"></nav>
      </section>
    </template>
    <template id="policy-card">
      <article class="card policy-card">
        <div class="policy-badges"><span class="badge badge--blue">정책 변화 예시</span><span class="policy-meta" data-policy-category></span><span class="policy-meta" data-policy-state></span></div>
        <h2><a data-policy-link></a></h2><p data-policy-summary></p>
        <h3 class="policy-change-label">핵심 변화</h3><p data-policy-card-change></p><div class="policy-comparison policy-card-comparison"><div><p class="field-help">변경 전</p><h3>기존 안내 기준</h3><p class="field-help" data-policy-card-before></p></div><div><p class="field-help">변경 후</p><h3>안내 기준</h3><p class="field-help" data-policy-card-after></p></div></div>
        <p class="field-help" data-policy-period></p><p class="field-help" data-policy-review></p>
        <div class="profile-actions"><a class="button button--subtle" data-policy-card-detail>안내 자세히 보기</a><a class="button button--primary" href="#/todos">관련 할 일 보기</a></div>
      </article>
    </template>
    <template id="policy-detail-view">
      <article class="wireframe-page policy-detail" aria-labelledby="policy-detail-title">
        <a class="button button--secondary" data-policy-back href="#/policies">정책 목록</a>
        <p class="auth-demo-note" data-policy-demo hidden>시연용 정책입니다. 실제 정책·대상 판정·실시간 AI 결과가 아닙니다.</p>
        <p class="policy-status" data-policy-status role="status">정책 정보를 확인하고 있어요.</p>
        <button class="button button--secondary" type="button" data-policy-retry hidden>다시 확인</button>
        <div data-policy-detail hidden><div class="policy-columns"><div class="policy-detail-main">
          <header class="card policy-panel"><div class="policy-badges"><span class="badge badge--warm">시연 예시</span><span class="badge badge--blue" data-policy-category></span><span class="badge badge--neutral" data-policy-state></span></div><h1 id="policy-detail-title"></h1><p data-policy-summary></p><p class="field-help" data-policy-period></p><p class="field-help" data-policy-review></p></header>
          <section class="card policy-panel" aria-labelledby="policy-ai-title"><h2 id="policy-ai-title">AI 요약</h2><p class="field-help">미리 작성한 요약 예시입니다. AI를 호출하거나 실제 정책을 분석한 결과가 아닙니다.</p><details><summary>요약 보기</summary><p class="policy-prose" data-policy-ai></p></details></section>
          <section class="card policy-panel"><h2>정책 안내</h2><p class="policy-prose" data-policy-content></p><h3>확인이 필요한 조건</h3><ul data-policy-conditions></ul><p class="field-help">프로필의 카드 선택만으로 정책 대상 여부를 확정하지 않습니다.</p></section>
          <section class="card policy-panel"><h2>변경 전후</h2><p data-policy-change></p><div class="policy-comparison"><div><h3>이전 버전</h3><p class="policy-prose" data-policy-before></p></div><div><h3>현재 버전</h3><p class="policy-prose" data-policy-after></p></div></div></section>
          <section class="card policy-panel"><h2>확인할 절차와 마감일</h2><ul data-policy-actions></ul></section>
          <section class="card policy-panel"><h2>출처와 확인일</h2><p class="field-help">공식 출처가 아닌 시연 자료입니다. 예시 주소는 외부 연결을 제공하지 않습니다.</p><ul data-policy-sources></ul></section>
        </div><aside class="policy-impact" aria-labelledby="impact-title"><p class="eyebrow">내 영향 확인</p><h2 id="impact-title">이 변화, 나와 관련 있나요?</h2><p class="impact-label">현재 이용 카드</p><p class="impact-value" data-policy-my-cards>교통 정보를 확인해 주세요.</p><p>다른 교통카드를 비교 중이라면,<br />이용 가능한 노선을 먼저 확인해보세요.</p><h3>지금 확인할 일</h3><p>내 이동 경로와 카드 이용 범위를 비교해요.</p><p class="field-help" data-policy-related-note>적용 대상 여부는 공식 조건을 확인해야 합니다.</p><a class="button button--rose" href="#/chat">BoSo에게 물어보기</a></aside></div></div>
      </article>
    </template>
    <template id="chat-view"><section class="wireframe-page" data-feature-root></section></template>
    <template id="todos-view"><section class="wireframe-page" data-feature-root></section></template>
    <template id="auth-view">
      <section class="auth-card card" aria-labelledby="auth-title">
        <p class="auth-brand">BoSo</p>
        <h1 id="auth-title" data-auth-title>로그인</h1>
        <p class="auth-description" data-auth-description>나에게 필요한 교통 혜택을 함께 살펴봐요.</p>
        <p class="auth-demo-note" data-demo-note hidden>시연 모드입니다. 실제 개인정보 대신 예시 이메일과 비밀번호를 사용해 주세요. 만든 계정은 이 화면을 새로고침하면 초기화됩니다.</p>
        <p class="form-message" data-auth-message role="alert" hidden></p>
        <form data-auth-form method="post">
          <fieldset class="auth-fields">
            <legend class="visually-hidden">계정 정보 입력</legend>
            <div class="form-field">
              <label for="auth-email">이메일</label>
              <input id="auth-email" name="email" type="email" maxlength="320" autocomplete="username" placeholder="you@example.com" required />
            </div>
            <div class="form-field">
              <label for="auth-password">비밀번호</label>
              <input id="auth-password" name="password" type="password" autocomplete="current-password" aria-describedby="password-help" required />
              <p class="field-help" id="password-help">15~128자로 입력해 주세요. 공백도 비밀번호에 포함됩니다.</p>
            </div>
            <div class="form-field" data-confirm-field hidden>
              <label for="auth-confirmation">비밀번호 확인</label>
              <input id="auth-confirmation" name="confirmation" type="password" autocomplete="new-password" />
            </div>
            <button class="button button--primary auth-submit" type="submit" data-auth-submit>로그인</button>
            <button class="button button--secondary" type="button" data-demo-login hidden>시연 계정으로 둘러보기</button>
          </fieldset>
        </form>
        <p class="auth-switch"><span data-switch-description>아직 계정이 없으신가요?</span> <a href="#/signup" data-switch-link>회원가입</a></p>
      </section>
    </template>
    <template id="profile-view">
      <section class="profile-page" aria-labelledby="profile-title">
        <div class="page-heading"><h1 id="profile-title">내 정보</h1><p>나에게 필요한 교통 혜택을 위해 정보를 관리해요.</p></div>
        <section class="card profile-identity" aria-label="계정 정보">
          <span class="profile-avatar" aria-hidden="true"><svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><circle cx="12" cy="7" r="4" /><path d="M4 21v-2a8 8 0 0 1 16 0v2" /></svg></span>
          <div><h2>BoSo 회원</h2><p data-profile-email></p></div>
        </section>
        <p class="auth-demo-note" data-profile-demo hidden>시연 정보입니다. 실제 개인정보 대신 예시를 입력해 주세요. 로그인은 새로고침 시 초기화되며, 이 시연 계정의 교통 정보만 현재 브라우저에 저장됩니다.</p>
        <p class="profile-feedback" data-profile-feedback role="status" tabindex="-1">교통 정보를 불러오고 있어요.</p>
        <button class="button button--secondary" type="button" data-profile-retry hidden>다시 불러오기</button>
        <section class="card profile-panel" data-profile-summary hidden aria-labelledby="transport-title">
          <div class="section-heading"><h2 id="transport-title">내 교통 정보</h2><span class="badge" data-profile-completeness></span></div>
          <p class="field-help" data-profile-missing></p>
          <dl class="profile-details">
            <div><dt>생년월일</dt><dd data-profile-birth></dd></div>
            <div><dt>나이</dt><dd data-profile-age></dd></div>
            <div><dt>거주 지역</dt><dd data-profile-region></dd></div>
            <div><dt>현재 이용 중인 카드</dt><dd data-profile-cards></dd></div>
            <div><dt>주요 이동 수단</dt><dd data-profile-modes></dd></div>
          </dl>
          <p class="field-help" data-profile-updated></p>
          <div class="profile-actions"><button class="button button--primary" type="button" data-profile-edit>교통 정보 수정</button></div>
        </section>
        <section class="card profile-panel" data-profile-editor hidden aria-labelledby="profile-edit-title">
          <h2 id="profile-edit-title" tabindex="-1">내 교통 정보 등록·수정</h2>
          <p class="auth-description">선택한 정보를 맞춤 안내에 사용해요. 일부 정보만 저장하거나 비워 둘 수도 있습니다.</p>
          <form data-profile-form method="post">
            <fieldset class="profile-fields">
              <legend class="visually-hidden">교통 정보 입력</legend>
              <div class="form-field"><label for="profile-region">거주 지역</label><select id="profile-region" name="region_code"><option value="">선택하지 않음</option></select></div>
              <div class="form-field"><label for="profile-birth">생년월일</label><input id="profile-birth" name="birth_date" type="date" min="1900-01-01" autocomplete="bday" aria-describedby="profile-birth-help" /><p class="field-help" id="profile-birth-help">1900년 1월 1일부터 기준일 사이로 입력해 주세요.</p></div>
              <fieldset class="profile-choices"><legend>현재 이용 중인 교통카드</legend><p class="field-help" id="profile-card-help">K-패스와 기후동행카드는 함께 선택할 수 있습니다. 기타 / 이용 카드 없음은 단독 선택합니다.</p><div data-profile-card-choices></div></fieldset>
              <fieldset class="profile-choices"><legend>주요 이동 수단</legend><div data-profile-mode-choices></div></fieldset>
              <div class="profile-actions"><button class="button button--primary" type="submit" data-profile-save>저장하기</button><button class="button button--secondary" type="button" data-profile-cancel>취소</button></div>
            </fieldset>
          </form>
        </section>
        <section class="card profile-panel" aria-labelledby="account-settings-title"><h2 id="account-settings-title">계정 설정</h2><div class="profile-actions"><button class="button button--secondary" type="button" data-profile-logout>로그아웃</button><button class="button button--secondary" type="button" data-profile-reset hidden>시연 교통 정보 초기화</button></div></section>
      </section>
    </template>
    <template id="session-view">
      <section class="auth-card card" aria-labelledby="session-title">
        <span class="badge badge--blue">BoSo 계정</span>
        <h1 id="session-title" data-session-title>로그인 정보를 확인하고 있어요</h1>
        <p class="auth-description" data-session-description>잠시만 기다려 주세요.</p>
        <div class="session-actions" data-session-actions hidden>
          <button class="button button--primary" type="button" data-retry-session>다시 연결</button>
          <a class="button button--secondary" href="#/login">로그인 화면</a>
        </div>
      </section>
    </template>
    <template id="placeholder-view">
      <div class="page-heading"><h1 data-heading></h1><p data-description></p></div>
      <section class="card">
        <span class="badge badge--neutral">준비 중</span>
        <div class="empty-state">
          <span class="empty-state__icon" aria-hidden="true"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"><circle cx="12" cy="12" r="10" /><path d="M12 11v6M12 7v.01" /></svg></span>
          <h2 data-empty-title>조금만 기다려 주세요</h2>
          <p data-empty-description>더 편리하게 이용하실 수 있도록 준비하고 있어요.</p>
          <div class="empty-state__action"><a class="button button--secondary" href="#/home">홈으로 이동</a></div>
        </div>
      </section>
    </template>
